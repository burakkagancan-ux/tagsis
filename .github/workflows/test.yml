name: Testler
# Her PR'da ve main'e her gönderimde tüm testleri çalıştırır (dış bağımlılık yok, npm install gerekmez)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sözdizimi (sayfalardaki script blokları)
        run: node test/sozdizimi.js
      - name: Gıda
        run: node test/cases.js
      - name: E kodu kaynakları
        run: node test/e_dogrulama.js
      - name: Tuz / sodyum
        run: node test/sodyum.js
      - name: Kanserojen uyarısı
        run: node test/kanser.js
      - name: Birlikte dikkat
        run: node test/eslesme.js
      - name: Üretim yolu
        run: node test/uretim.js
      - name: OCR toleransı
        run: node test/ocr_tolerans.js
      - name: Kozmetik veri
        run: node test/kozmetik_veri.js
      - name: Kozmetik durumlar
        run: node test/kozmetik_cases.js
      - name: Kozmetik K3
        run: node test/kozmetik_k3.js
      - name: Temizlik
        run: node test/temizlik.js
      - name: Karşılaştırma
        run: node test/karsilastir.js
      - name: Ansiklopedi
        run: node test/ansiklopedi.js
      - name: Paylaşım kartı
        run: node test/paylas.js
      - name: OCR Worker
        run: node worker/test.mjs
      - name: Veri üreteçleri (data/ ile kaynak/ uyumlu mu)
        # Üreteçleri depodaki kaynak dosyalarıyla çalıştırır; data/ değişirse JSON elle düzenlenmiş ya da üreteç çalıştırılmamış demektir.
        run: |
          for g in gen_e_kodlari gen_bilesenler gen_e_aciklama gen_kozmetik gen_eslesmeler gen_temizlik gen_ansiklopedi; do python3 $g.py; done
          git diff --stat --exit-code -I '"generated":' -- data/
